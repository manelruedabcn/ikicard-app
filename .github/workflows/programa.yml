name: Programa un mes

# Se ejecuta cada hora en punto. El endpoint solo envía a partir de las 8:00
# de Madrid y nunca repite un correo (programa_envios), así que si una
# ejecución falla, la siguiente recupera lo pendiente.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: programa-un-mes
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger programa endpoint
        run: |
          curl -fsS --connect-timeout 15 --max-time 240 -X POST "https://app.ikigaier.com/api/cron/programa" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
      # Seguimiento del Inventario a los 3 días. Paso aparte: si falla, el
      # programa ya se ha enviado y la siguiente ejecución lo reintenta.
      - name: Trigger seguimiento del Inventario
        continue-on-error: true
        run: |
          curl -fsS --connect-timeout 15 --max-time 240 -X POST "https://app.ikigaier.com/api/cron/inventario-seguimiento" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
