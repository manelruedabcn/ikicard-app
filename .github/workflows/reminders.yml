name: Viaje reminders

# Se ejecuta cada hora en punto. El endpoint decide a quién enviar según la
# hora local (8:00) de la zona horaria de cada persona.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        run: |
          curl -fsS -X POST "https://app.ikigaier.com/api/cron/reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
